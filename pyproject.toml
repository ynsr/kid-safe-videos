[project]
name = "kidsafe"
version = "0.1.0"
description = "Fast, lossless cutting of unsafe scenes from cartoons for ages 3+. No blurring, no re-encoding."
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "pillow",
    "pyyaml",
    "jsonschema",
    "flask",
]
requires-dist = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
kidsafe = "kidsafe.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kidsafe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
